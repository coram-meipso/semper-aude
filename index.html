<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>semper aude</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap');

  :root {
    --bg: #FCFBF7;
    --ink: #1a1a18;
    --muted: #6b6b66;
    --line: #e4e2da;
    --accent: #D85A30;
    --accent-tint: #FAECE7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem clamp(1.5rem, 5vw, 4rem);
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: none;
  }

  .login-link {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 20px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .login-link:hover { border-color: var(--accent); color: var(--accent); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2rem clamp(1.5rem, 5vw, 4rem) 4rem;
    max-width: 720px;
  }

  .eyebrow {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.8rem, 8vw, 5rem);
    line-height: 1.02;
    letter-spacing: -0.01em;
    margin-bottom: 1.5rem;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  p.lede {
    font-size: 1.05rem;
    color: var(--muted);
    line-height: 1.6;
    max-width: 46ch;
    margin-bottom: 2.8rem;
  }

  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .cat {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 20px;
    background: var(--accent-tint);
    color: #712B13;
    font-size: 0.9rem;
    text-decoration: none;
  }

  .cat svg { width: 16px; height: 16px; stroke: #712B13; }

  footer {
    padding: 1.5rem clamp(1.5rem, 5vw, 4rem);
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 0.5s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">semper aude</a>
  <a class="login-link" href="https://home.semper-au.de">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    Login
  </a>
</header>

<main>
  <div class="eyebrow">semper-au.de</div>
  <h1>Immer wieder<br><em>etwas wagen.</em></h1>
  <p class="lede">
    Diese Seite entsteht gerade. Hier werden mit der Zeit Notizen aus Projekten,
    Alltag und Familie zusammenkommen &ndash; im Moment steht erst das Fundament.
  </p>
  <div class="categories">
    <span class="cat">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      Blog
    </span>
    <span class="cat">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Projekte
    </span>
    <span class="cat">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20a6 6 0 00-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg>
      Familie
    </span>
  </div>
</main>

<footer>
  &copy; 2026 semper-au.de
</footer>

</body>
</html>
